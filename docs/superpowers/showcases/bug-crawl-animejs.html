<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bug Crawl — anime.js + Walking Legs</title>
  <style>
    :root {
      --cream: #EDE7DD; --slate: #5B7A8C; --sage: #6D7A5E; --ink: #2A2420; --rule: #C9C2B5;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--cream); color: var(--ink); font-family: Georgia, serif; overflow: hidden; }
    .hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: baseline; justify-content: space-between; padding: 18px 24px; pointer-events: none; }
    .hud h1 { font-weight: 500; font-size: 20px; margin: 0; }
    .hud p { font-family: "Courier New", monospace; font-size: 12px; color: var(--slate); margin: 4px 0 0; }
    .hud button { pointer-events: auto; font-family: "Courier New", monospace; font-size: 12px; background: #fff; border: 1px solid var(--rule); color: var(--ink); padding: 8px 14px; cursor: pointer; }
    .hud button:hover { border-color: var(--slate); color: var(--slate); }
    .hud .warn { color: #a3372f; }
    #stage { position: fixed; inset: 0; cursor: crosshair; }
    .bug { position: absolute; top: 0; left: 0; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.18)); }
    .bug svg { display: block; overflow: visible; }
    .bug .body { fill: var(--fill-0, #5D4949); }
    .bug .antenna { stroke: var(--stroke-0, #2A2420); stroke-width: 1.75; stroke-linecap: round; fill: none; }
    .bug .leg path { stroke: var(--stroke-0, #2A2420); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>
</head>
<body>
  <div class="hud">
    <div>
      <h1>Bug Crawl — anime.js + walking legs</h1>
      <p>docs/superpowers/assets/icons/bug.svg, legs split out and walked · body wanders via <a href="https://animejs.com" target="_blank" rel="noopener">anime.js</a> v3 (CDN), legs walk via a looping anime.js gait tween · click to drop a bug · <span id="count">0</span> crawling</p>
    </div>
    <button id="rescatter" type="button">↻ re-scatter</button>
  </div>

  <div id="stage"></div>

  <!-- Body/antenna paths lifted verbatim from docs/superpowers/assets/icons/bug.svg.
       Its two multi-subpath leg strokes are split into 6 individual <path>s (one per leg),
       each wrapped in a hip-anchored <g> so it can be rotated independently. -->
  <template id="bug-template">
    <div class="bug">
      <svg viewBox="0 0 35 67" width="30" height="57">
        <g class="leg-hip" transform="translate(22.2671,48.6146)"><g class="leg-swing leg" data-group="A"><path d="M0,0 L7.5063,-1.6221 L3.0025,12.3854 L4.7329,16.3854" /></g></g>
        <g class="leg-hip" transform="translate(22.2671,38.6045)"><g class="leg-swing leg" data-group="B"><path d="M0,0 L7.2329,-1.1045 L11.2329,5.3955" /></g></g>
        <g class="leg-hip" transform="translate(24.1437,31.0957)"><g class="leg-swing leg" data-group="A"><path d="M0,0 L4.3563,-2.5957 L9.3563,-1.5957" /></g></g>
        <g class="leg-hip" transform="translate(13.2329,48.6146)"><g class="leg-swing leg" data-group="B"><path d="M0,0 L-7.5063,-1.6221 L-3.0025,12.3854 L-4.7329,16.3854" /></g></g>
        <g class="leg-hip" transform="translate(13.2329,38.6045)"><g class="leg-swing leg" data-group="A"><path d="M0,0 L-7.2329,-1.1045 L-11.2329,5.3955" /></g></g>
        <g class="leg-hip" transform="translate(11.3563,31.0957)"><g class="leg-swing leg" data-group="B"><path d="M0,0 L-4.3563,-2.5957 L-9.3563,-1.5957" /></g></g>
        <path class="body" d="M26.0014 30.345C26.0014 35.9415 26.8143 61.4961 17.7633 61.4961C8.71226 61.4961 9.5252 35.9415 9.5252 30.345C9.5252 24.7484 13.2135 20.2115 17.7633 20.2114C22.3131 20.2114 26.0014 24.7484 26.0014 30.345Z" />
        <path class="antenna" d="M20.7657 21.7128C21.7666 14.3316 25.1945 -0.130604 30.8993 1.07041" />
        <path class="antenna" d="M14.3854 21.7128C13.3845 14.3316 9.95665 -0.130604 4.25186 1.07041" />
      </svg>
    </div>
  </template>

  <!-- Only external dependency: anime.js v3, loaded from a public CDN. Everything else is inline. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script>
    (function () {
      "use strict";

      var stage = document.getElementById("stage");
      var countLabel = document.getElementById("count");
      var rescatterBtn = document.getElementById("rescatter");
      var tmpl = document.getElementById("bug-template");

      if (typeof anime === "undefined") {
        document.querySelector(".hud p").innerHTML =
          '<span class="warn">anime.js failed to load from the CDN (offline?) — this variant needs network access.</span>';
        return;
      }

      var TINTS = [
        ["#5D4949", "#2A2420"], ["#49525D", "#2A2420"], ["#4A5D49", "#2A2420"], ["#5D4F3A", "#2A2420"],
      ];

      function rand(min, max) { return min + Math.random() * (max - min); }
      function shortestAngleTo(from, to) {
        var diff = ((to - from + 180) % 360 + 360) % 360 - 180;
        return from + diff;
      }

      var bugs = [];

      function makeBug(x, y) {
        var node = tmpl.content.firstElementChild.cloneNode(true);
        var tint = TINTS[Math.floor(rand(0, TINTS.length))];
        node.style.setProperty("--fill-0", tint[0]);
        node.style.setProperty("--stroke-0", tint[1]);
        var scale = rand(0.1, 0.3);
        node.querySelector("svg").style.transform = "scale(" + scale.toFixed(2) + ")";
        stage.appendChild(node);

        var legs = Array.prototype.slice.call(node.querySelectorAll(".leg-swing")).map(function (leg) {
          return { el: leg, group: leg.dataset.group };
        });

        var state = {
          el: node, w: 30 * scale, h: 57 * scale,
          x: x, y: y, heading: rand(0, 360),
          posAnim: null, gaitAnim: null, gaitPhase: 0,
          legs: legs,
        };

        wanderTo(state, nextWaypoint(state));
        startGait(state);
        return state;
      }

      function nextWaypoint(state) {
        var w = window.innerWidth, h = window.innerHeight, margin = 40;
        var maxStep = 260;
        var nx = Math.max(margin, Math.min(w - margin, state.x + rand(-maxStep, maxStep)));
        var ny = Math.max(margin, Math.min(h - margin, state.y + rand(-maxStep, maxStep)));
        return { x: nx, y: ny };
      }

      // Body position + heading: a chained anime.js tween that re-targets itself on completion.
      function wanderTo(state, target) {
        var dx = target.x - state.x, dy = target.y - state.y;
        var dist = Math.hypot(dx, dy) || 1;
        var targetHeadingDeg = (Math.atan2(dy, dx) * 180) / Math.PI + 90; // shape's forward is up (0deg)
        var headingTo = shortestAngleTo(state.heading, targetHeadingDeg);
        var speed = rand(35, 80);
        var duration = (dist / speed) * 1000;

        state.posAnim = anime({
          targets: state,
          x: target.x,
          y: target.y,
          heading: headingTo,
          duration: Math.max(400, duration),
          easing: "easeInOutSine",
          update: function () {
            var tx = state.x - state.w / 2;
            var ty = state.y - state.h / 2;
            state.el.style.transform = "translate3d(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px,0) rotate(" + state.heading.toFixed(1) + "deg)";
          },
          complete: function () {
            wanderTo(state, nextWaypoint(state));
          },
        });
      }

      // Legs: an independent looping anime.js tween sweeps a gaitPhase value 0→360,
      // an alternating tripod (group A / group B) reads sin(phase) off it each frame.
      function startGait(state) {
        state.gaitAnim = anime({
          targets: state,
          gaitPhase: 360,
          duration: rand(450, 700),
          easing: "linear",
          loop: true,
          update: function () {
            var rad = (state.gaitPhase * Math.PI) / 180;
            var amplitude = 13;
            for (var i = 0; i < state.legs.length; i++) {
              var leg = state.legs[i];
              var phase = rad + (leg.group === "A" ? 0 : Math.PI);
              var delta = Math.sin(phase) * amplitude;
              leg.el.style.transform = "rotate(" + delta.toFixed(1) + "deg)";
            }
          },
        });
      }

      function spawnRandom(n) {
        var w = window.innerWidth, h = window.innerHeight;
        for (var i = 0; i < n; i++) bugs.push(makeBug(rand(0, w), rand(0, h)));
        countLabel.textContent = String(bugs.length);
      }

      function clearBugs() {
        for (var i = 0; i < bugs.length; i++) {
          if (bugs[i].posAnim) bugs[i].posAnim.pause();
          if (bugs[i].gaitAnim) bugs[i].gaitAnim.pause();
          bugs[i].el.remove();
        }
        bugs = [];
        countLabel.textContent = "0";
      }

      function scatter() {
        clearBugs();
        spawnRandom(Math.floor(rand(10, 16)));
      }

      stage.addEventListener("click", function (e) {
        bugs.push(makeBug(e.clientX, e.clientY));
        countLabel.textContent = String(bugs.length);
      });
      rescatterBtn.addEventListener("click", scatter);

      scatter();
    })();
  </script>
</body>
</html>
