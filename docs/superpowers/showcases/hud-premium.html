<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium HUD — Fun Satire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-scene: radial-gradient(circle at 50% 40%, #2a1f1a 0%, #1a1014 100%);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.9);
      --shadow-outer: 0px 24px 40px rgba(97, 86, 80, 0.25);
      --shadow-inner: 0px 4px 0px rgba(255, 255, 255, 1);
      --icon-size: 32px;
      --btn-size: 46px;
      --btn-gap: 12px;
      --hud-padding-v: 12px;
      --hud-padding-h: 24px;
      --attack-gradient-from: #de7666;
      --attack-gradient-to: #e9975d;
      --attack-border: #a74333;
      --attack-shadow: 0px 4px 0px #b75040;
      --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-scene);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .scene { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    .scene-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(244, 236, 220, 0.15); font-size: 14px; letter-spacing: 0.2em;
      text-transform: uppercase; pointer-events: none; user-select: none;
    }

    /* ============================================
       HUD CONTAINER
       ============================================ */
    .hud {
      position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: var(--btn-gap);
      padding: var(--hud-padding-v) var(--hud-padding-h) var(--hud-padding-v) var(--hud-padding-v);
      background: var(--glass-bg);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border); border-radius: 82px;
      box-shadow: var(--shadow-inner), var(--shadow-outer);
      z-index: 1000;
      animation: hud-entrance 0.8s var(--ease-spring) forwards;
    }

    .hud:hover { transform: translateX(-50%) translateY(-2px); transition: transform 0.6s var(--ease-spring); }

    /* ============================================
       DRAG HANDLE
       ============================================ */
    .hud-drag-handle {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.4; cursor: grab;
      transition: opacity 0.3s var(--ease-smooth);
    }
    .hud-drag-handle:hover { opacity: 0.7; }
    .hud-drag-handle:active { cursor: grabbing; opacity: 1; }
    .hud-drag-handle svg { width: 24px; height: 24px; pointer-events: none; }

    /* ============================================
       ICON BUTTON BASE
       ============================================ */
    .hud-btn {
      position: relative; width: var(--btn-size); height: var(--btn-size);
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; cursor: pointer; border-radius: 50%;
      transition: all 0.5s var(--ease-spring);
      outline: none; -webkit-tap-highlight-color: transparent;
    }

    .hud-btn::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
      opacity: 0; transition: opacity 0.4s var(--ease-smooth);
    }
    .hud-btn:hover::before { opacity: 1; }
    .hud-btn:hover { transform: scale(1.08); }
    .hud-btn:active { transform: scale(0.95); transition-duration: 0.15s; }
    .hud-btn:focus-visible { box-shadow: 0 0 0 3px rgba(97, 86, 80, 0.3); }

    .hud-btn svg {
      width: var(--icon-size); height: var(--icon-size);
      transition: transform 0.5s var(--ease-spring); pointer-events: none;
    }
    .hud-btn:hover svg { transform: translateY(-1px); }
    .hud-btn:active svg { transform: translateY(0) scale(0.92); transition-duration: 0.15s; }

    /* ============================================
       MODE SELECTOR GRADIENTS
       Only active mode shows gradient
       ============================================ */
    .hud-btn--eye,
    .hud-btn--bug,
    .hud-btn--hand {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 30px;
      box-shadow: none;
      transition: all 0.4s var(--ease-spring);
    }

    .hud-btn--eye.active {
      background: linear-gradient(180deg, #f78d8d 0%, #e26790 100%);
      border: 1px solid #a02b4d;
      box-shadow: 0px 4px 0px #a02b4d;
    }
    .hud-btn--bug.active {
      background: linear-gradient(180deg, #74d4e7 0%, #3a85ba 100%);
      border: 1px solid #226591;
      box-shadow: 0px 4px 0px #226591;
    }
    .hud-btn--hand.active {
      background: linear-gradient(180deg, #8be774 0%, #3cba3a 100%);
      border: 1px solid #228b20;
      box-shadow: 0px 4px 0px #228b20;
    }

    .hud-btn--eye.active:hover { box-shadow: 0px 6px 0px #a02b4d, 0px 8px 16px rgba(160, 43, 77, 0.3); }
    .hud-btn--bug.active:hover { box-shadow: 0px 6px 0px #226591, 0px 8px 16px rgba(34, 101, 145, 0.3); }
    .hud-btn--hand.active:hover { box-shadow: 0px 6px 0px #228b20, 0px 8px 16px rgba(34, 139, 32, 0.3); }

    .hud-btn--eye.active:active { transform: scale(0.95) translateY(2px); box-shadow: 0px 2px 0px #a02b4d; transition-duration: 0.1s; }
    .hud-btn--bug.active:active { transform: scale(0.95) translateY(2px); box-shadow: 0px 2px 0px #226591; transition-duration: 0.1s; }
    .hud-btn--hand.active:active { transform: scale(0.95) translateY(2px); box-shadow: 0px 2px 0px #228b20; transition-duration: 0.1s; }

    /* Right-side ellipse backgrounds */
    .hud-btn--cockroach,
    .hud-btn--gallery,
    .hud-btn--settings {
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.3) 70%);
      border-radius: 50%;
    }

    /* ============================================
       ATTACK BUTTON
       ============================================ */
    .hud-attack {
      position: relative; height: 39px; padding: 0 16px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, var(--attack-gradient-from) 0%, var(--attack-gradient-to) 100%);
      border: 1px solid var(--attack-border); border-radius: 12px;
      box-shadow: var(--attack-shadow);
      color: white; font-family: "Bungee", cursive; font-size: 16px;
      text-transform: uppercase; letter-spacing: 0.02em;
      cursor: pointer; transition: all 0.4s var(--ease-spring);
      outline: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
    }

    .hud-attack::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
      opacity: 0; transition: opacity 0.4s var(--ease-smooth);
    }
    .hud-attack::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      width: 0; height: 0; border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%);
      transition: width 0.6s var(--ease-spring), height 0.6s var(--ease-spring);
    }

    .hud-attack:hover { transform: translateY(-2px); box-shadow: 0px 6px 0px #b75040, 0px 8px 20px rgba(183, 80, 64, 0.4); }
    .hud-attack:hover::before { opacity: 1; }
    .hud-attack:active { transform: translateY(2px); box-shadow: 0px 2px 0px #b75040; transition-duration: 0.1s; }
    .hud-attack:active::after { width: 200px; height: 200px; transition-duration: 0.3s; }
    .hud-attack:focus-visible { box-shadow: var(--attack-shadow), 0 0 0 3px rgba(222, 118, 102, 0.4); }
    .hud-attack span { position: relative; z-index: 1; }

    /* ============================================
       TOOLTIP
       ============================================ */
    .hud-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute; bottom: calc(100% + 12px); left: 50%;
      transform: translateX(-50%) translateY(8px);
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 8px;
      box-shadow: 0px 8px 16px rgba(97, 86, 80, 0.2);
      color: #2a1f1a; font-size: 12px; font-weight: 500;
      letter-spacing: 0.02em; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: all 0.4s var(--ease-spring);
    }
    .hud-btn[data-tooltip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 768px) {
      .hud { bottom: 24px; padding: 10px 16px 10px 10px; gap: 8px; }
      .hud-btn { width: 40px; height: 40px; }
      .hud-btn svg { width: 28px; height: 28px; }
      .hud-drag-handle { width: 20px; height: 20px; }
      .hud-drag-handle svg { width: 20px; height: 20px; }
      .hud-attack { height: 34px; padding: 0 12px; font-size: 14px; }
      .hud-btn[data-tooltip]::after { display: none; }
    }

    /* ============================================
       ENTRANCE ANIMATION
       ============================================ */
    @keyframes hud-entrance {
      from { opacity: 0; transform: translateX(-50%) translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes btn-entrance {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .hud-drag-handle,
    .hud-btn,
    .hud-attack {
      animation: btn-entrance 0.6s var(--ease-spring) forwards;
      opacity: 0;
    }

    .hud-drag-handle { animation-delay: 0.05s; }
    .hud-btn:nth-child(2) { animation-delay: 0.1s; }
    .hud-btn:nth-child(3) { animation-delay: 0.15s; }
    .hud-btn:nth-child(4) { animation-delay: 0.2s; }
    .hud-attack { animation-delay: 0.3s; }
    .hud-btn:nth-child(6) { animation-delay: 0.35s; }
    .hud-btn:nth-child(7) { animation-delay: 0.4s; }
    .hud-btn:nth-child(8) { animation-delay: 0.45s; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="scene-label">Fun Satire — Premium HUD Showcase</div>
  </div>

  <div class="hud" role="toolbar" aria-label="Game controls">
    <div class="hud-drag-handle" aria-label="Drag to move">

      </svg>
    </div>

    <button class="hud-btn hud-btn--eye active" data-tooltip="Eye Mode" aria-label="Eye Mode">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 7C8.33741 7 5.07932 8.95853 3 12C5.07932 15.0415 8.33741 17 12 17C15.6626 17 18.9207 15.0415 21 12C18.9207 8.95853 15.6626 7 12 7Z" stroke="#2a1f1a" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="3" stroke="#2a1f1a" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="hud-btn hud-btn--bug" data-tooltip="Bug Mode" aria-label="Bug Mode">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 2C7.63612 2 10.0643 2.86783 12 4.32634M19 2C16.3639 2 13.9357 2.86783 12 4.32634M12 4.32634C9.29033 6.36796 7.54545 9.56698 7.54545 13.1632C7.54545 16.7594 9.29033 19.9584 12 22C14.7097 19.9584 16.4545 16.7594 16.4545 13.1632C16.4545 9.56698 14.7097 6.36796 12 4.32634Z" stroke="#2a1f1a" stroke-linecap="round"/>
        <path d="M12 13C12 13 15 11.2091 15 9C15 6.79086 12 5 12 5C12 5 9 6.79086 9 9C9 11.2091 12 13 12 13ZM12 13V21.5" stroke="#2a1f1a" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="hud-btn hud-btn--hand" data-tooltip="Point Mode" aria-label="Point Mode">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 13.5V11.3333C16 10.597 16.6716 10 17.5 10C18.3284 10 19 10.597 19 11.3333V14.5" stroke="#2a1f1a" stroke-linecap="round"/>
        <path d="M10 12L10 9.09091C10 8.48842 10.6716 8 11.5 8C12.3284 8 13 8.48842 13 9.09091V12" stroke="#2a1f1a" stroke-linecap="round"/>
        <path d="M7 14L7 3.24138C7 2.55578 7.67157 2 8.5 2C9.32843 2 10 2.55578 10 3.24138V12.5" stroke="#2a1f1a" stroke-linecap="round"/>
        <path d="M16 13.5V10.3636C16 9.61052 15.3284 9 14.5 9C13.6716 9 13 9.61052 13 10.3636L13 12.5" stroke="#2a1f1a" stroke-linecap="round"/>
        <path d="M19 14.2767C19 18.6011 17.1943 22 11.7864 22C7.19799 22 5.56206 18.8789 4.25646 14.9425C3.777 13.4969 3.98603 13.0519 4.74791 12.4217C5.49493 11.8038 6.71372 11.9179 7.20517 12.4219" stroke="#2a1f1a"/>
      </svg>
    </button>

    <button class="hud-attack" aria-label="Attack">
      <span>Attack</span>
    </button>

    <button class="hud-btn hud-btn--cockroach" data-tooltip="Cockroach Mode" aria-label="Cockroach Mode">
      <svg width="35" height="67" viewBox="0 0 35 67" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g clip-path="url(#clip0_18_109)">
          <path d="M22.2671 48.6146L29.7734 46.9925L25.2696 61L27 65M22.2671 38.6045L29.5 37.5L33.5 44M24.1437 31.0957L28.5 28.5L33.5 29.5" stroke="#2a1f1a" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M13.2329 48.6146L5.7266 46.9925L10.2304 61L8.5 65M13.2329 38.6045L6 37.5L2 44M11.3563 31.0957L7 28.5L2 29.5" stroke="#2a1f1a" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M26.0014 30.345C26.0014 35.9415 26.8143 61.4961 17.7633 61.4961C8.71226 61.4961 9.5252 35.9415 9.5252 30.345C9.5252 24.7484 13.2135 20.2115 17.7633 20.2114C22.3131 20.2114 26.0014 24.7484 26.0014 30.345Z" fill="#5D4949"/>
          <path d="M20.7657 21.7128C21.7666 14.3316 25.1945 -0.130604 30.8993 1.07041" stroke="#2a1f1a" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M14.3854 21.7128C13.3845 14.3316 9.95665 -0.130604 4.25186 1.07041" stroke="#2a1f1a" stroke-width="1.75" stroke-linecap="round"/>
        </g>
        <defs>
          <clipPath id="clip0_18_109">
            <rect width="35" height="67" fill="white"/>
          </clipPath>
        </defs>
      </svg>
    </button>

    <button class="hud-btn hud-btn--gallery" data-tooltip="Grid View" aria-label="Grid View">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 7C5 5.89543 5.89543 5 7 5H11V9C11 10.1046 10.1046 11 9 11H5V7Z" stroke="#2a1f1a" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 5H17C18.1046 5 19 5.89543 19 7V11H15C13.8954 11 13 10.1046 13 9V5Z" stroke="#2a1f1a" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 15C13 13.8954 13.8954 13 15 13H19V17C19 18.1046 18.1046 19 17 19H13V15Z" stroke="#2a1f1a" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 13H9C10.1046 13 11 13.8954 11 15V19H7C5.89543 19 5 18.1046 5 17V13Z" stroke="#2a1f1a" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="hud-btn hud-btn--settings" data-tooltip="Settings" aria-label="Settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12L21 12" stroke="#2a1f1a" stroke-linecap="round"/>
        <path d="M3 6L21 6" stroke="#2a1f1a" stroke-linecap="round"/>
        <path d="M3 18L21 18" stroke="#2a1f1a" stroke-linecap="round"/>
        <circle cx="7" cy="12" r="2" fill="white" stroke="#2a1f1a" stroke-linecap="round"/>
        <circle cx="16" cy="6" r="2" fill="white" stroke="#2a1f1a" stroke-linecap="round"/>
        <circle cx="13" cy="18" r="2" fill="white" stroke="#2a1f1a" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <script>
    document.querySelectorAll('.hud-btn').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        const strength = 0.15;
        btn.style.transform = `scale(1.08) translate(${x * strength}px, ${y * strength}px)`;
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = 'scale(1)';
      });
    });

    const modeButtons = document.querySelectorAll('.hud-btn--eye, .hud-btn--bug, .hud-btn--hand');
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.querySelector('.hud-attack').addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      this.style.setProperty('--ripple-x', (e.clientX - rect.left) + 'px');
      this.style.setProperty('--ripple-y', (e.clientY - rect.top) + 'px');
      this.classList.add('rippling');
      setTimeout(() => this.classList.remove('rippling'), 600);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') document.body.classList.add('keyboard-nav');
    });
    document.addEventListener('mousedown', () => {
      document.body.classList.remove('keyboard-nav');
    });
  </script>
</body>
</html>
