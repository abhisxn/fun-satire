<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary Meta Tags -->
    <title>Fun Satire — A crowd that watches back</title>
    <meta name="description" content="A satirical toy about reclaiming power. No leader to arrest. No face to blame. Just thousands, done waiting." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.guttergeneration.com/" />
    <meta property="og:title" content="Fun Satire — A crowd that watches back" />
    <meta property="og:description" content="A satirical toy about reclaiming power. No leader to arrest. No face to blame. Just thousands, done waiting." />
    <meta property="og:image" content="https://www.guttergeneration.com/share-image.png" />
    <meta property="og:site_name" content="Fun Satire" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.guttergeneration.com/" />
    <meta name="twitter:title" content="Fun Satire — A crowd that watches back" />
    <meta name="twitter:description" content="A satirical toy about reclaiming power. No leader to arrest. No face to blame. Just thousands, done waiting." />
    <meta name="twitter:image" content="https://www.guttergeneration.com/share-image.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle, #EBE9E0 0%, #CDC0B8 65%, #AA988E 100%);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, transparent 50%, rgba(0,0,0,0.15) 100%);
        pointer-events: none;
        z-index: 1;
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 500;
        pointer-events: none;
      }
      #stage > .wrap {
        position: absolute;
        pointer-events: none;
        will-change: transform;
        z-index: 300;
      }
      #hud-root {
        position: relative;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
