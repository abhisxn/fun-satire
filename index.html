<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fun Satire</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle, #EBE9E0 0%, #CDC0B8 65%, #AA988E 100%);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, transparent 50%, rgba(0,0,0,0.15) 100%);
        pointer-events: none;
        z-index: 1;
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }
      #hud-root {
        position: relative;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
